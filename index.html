<title>What's the Weather?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a sky-blue play table. Parts and stages run across the top, the sentence board sits in the middle, word cards lie below like printed cut-outs. */
:root{
  --sky:#e6f2fb; --sky-2:#d3e7f5; --paper:#ffffff; --ink:#1c2a3a; --muted:#53657a;
  --line:#b9cddf; --slot:#f2f8fd; --sun:#ffc93c; --sun-ink:#4d3400;
  --go:#22865a; --go-soft:#ddf2e6; --oops:#c3423d; --oops-soft:#fbe3e1; --focus:#2b6cd4; --shadow:rgba(20,40,70,.22);
  --font-display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0d1726; --sky-2:#15243a; --paper:#1a2a42; --ink:#eef4fb; --muted:#a4b6c9;
  --line:#3a5070; --slot:#14223a; --sun:#ffd25c; --sun-ink:#3a2700;
  --go:#4fc78c; --go-soft:#16392a; --oops:#ff8079; --oops-soft:#3d1d1d; --focus:#8db7ff; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0d1726; --sky-2:#15243a; --paper:#1a2a42; --ink:#eef4fb; --muted:#a4b6c9;
  --line:#3a5070; --slot:#14223a; --sun:#ffd25c; --sun-ink:#3a2700;
  --go:#4fc78c; --go-soft:#16392a; --oops:#ff8079; --oops-soft:#3d1d1d; --focus:#8db7ff; --shadow:rgba(0,0,0,.5); color-scheme:dark}

body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:16px}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5vw,42px);line-height:1;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.tool .he{font-family:system-ui,sans-serif}
.tool.stop{border-color:var(--ink)}
.wake{margin:0;font-weight:700;color:var(--muted);font-size:14px}

.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.part{font:inherit;text-align:left;border:2px solid transparent;background:var(--sky-2);color:var(--ink);border-radius:14px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.part .n{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.part .t{font-family:var(--font-display);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part[aria-current="true"]{background:var(--paper);border-color:var(--ink)}
.pips{letter-spacing:1px;color:var(--go)}
@media (max-width:620px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stages{display:flex;flex-wrap:wrap;gap:8px}
.stage{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.stage.done{color:var(--go);border-color:var(--go)}
.stage[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stage.locked{opacity:.55;border-style:dashed;cursor:not-allowed}
.stagebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.reset{font:inherit;font-weight:700;font-size:13px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:4px}
.reset.armed{color:var(--oops)}
.reset.on{color:var(--focus)}
.admin{display:flex;flex-wrap:wrap;gap:4px 10px}
.bcol{display:inline-flex;flex-direction:column;align-items:center;gap:4px;vertical-align:middle}
.fix{font:600 20px var(--font-display);color:var(--go);letter-spacing:.06em;line-height:1}
.fix mark{background:var(--sun);color:var(--sun-ink);border-radius:4px;padding:0 2px}
.fix.copy{color:var(--focus)}
.fix s{color:var(--muted);font-size:15px;letter-spacing:0;margin-left:6px}
.blank.almost{border-bottom-color:var(--sun);background:var(--go-soft)}
.blank.copy{border-bottom-color:var(--focus)}
.tile.hint{border-color:var(--sun);box-shadow:0 3px 0 var(--sun);background:var(--sun);color:var(--sun-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.listen-note{font-weight:800;color:var(--muted);font-size:15px}

.board{background:var(--paper);border-radius:24px;padding:20px clamp(14px,3vw,32px);display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 0 var(--line)}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.task{margin:0;font-weight:800;color:var(--muted);font-size:17px}
.progress{display:flex;gap:6px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--sky-2);border:2px solid var(--line)}
.dot.done{background:var(--sun);border-color:var(--sun)}
.dot.now{border-color:var(--ink)}

.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;font-family:var(--font-display);font-weight:600;font-size:clamp(24px,4.2vw,36px);line-height:1.25;min-height:130px;margin:0}
.say{border-radius:8px;padding:0 3px}
.say:hover{background:var(--sky)}
.tight{margin-left:-12px}
.given-word{color:var(--focus)}
.slot{font:inherit;width:clamp(100px,16vw,136px);min-height:clamp(100px,15vw,130px);border:3px dashed var(--line);border-radius:16px;background:var(--slot);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;padding:6px;position:relative}
.slot .q{font-size:38px;line-height:1;opacity:.55}
.slot.ready{border-color:var(--focus)}
.slot.over{border-color:var(--focus);background:var(--sky-2);transform:scale(1.04)}
.slot.filled{border-style:solid;border-color:var(--go);background:var(--go-soft);cursor:default}
.slot.given,.slot.shown{border-style:solid;border-color:var(--ink);background:var(--paper);cursor:default}
.slot.static{cursor:default}
.slot .pic{width:100%;aspect-ratio:220/200;border-radius:10px;overflow:hidden;display:block}
.slot .pic svg,.card .pic svg,.mini svg{width:100%;height:100%;display:block}
.slot .w{font-size:17px;color:var(--ink);font-weight:600;text-align:center;line-height:1.1}
.slot .emo{font-size:46px;line-height:1.15}

.blankwrap{display:inline-flex;align-items:center;gap:8px}
.mini{width:58px;height:53px;border-radius:8px;overflow:hidden;display:inline-grid;place-items:center;background:var(--sky);font-size:34px}
.blank{font:inherit;font-size:inherit;width:6.2ch;min-width:3ch;padding:0 6px;border:0;border-bottom:4px solid var(--ink);background:var(--slot);color:var(--ink);border-radius:8px 8px 0 0;text-align:center}
.blank:focus{outline:none;border-bottom-color:var(--focus);background:var(--sky-2)}
.blank.ok,.jum.ok .box{border-bottom-color:var(--go);background:var(--go-soft)}
.blank.bad{border-bottom-color:var(--oops);background:var(--oops-soft)}
.jum{display:inline-flex;flex-direction:column;align-items:center;gap:8px;vertical-align:middle}
.boxes{display:flex;gap:4px}
.box{font:inherit;font-size:.85em;width:1.25em;height:1.5em;border:0;border-bottom:4px solid var(--ink);background:var(--slot);color:var(--ink);border-radius:6px 6px 0 0;display:grid;place-items:center;padding:0;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:16em}
.tile{font:600 22px var(--font-display);width:38px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

.heard{margin:0;font-size:18px;font-weight:700;color:var(--muted);min-height:1.4em}
.heard q{color:var(--ink);quotes:"“" "”"}
.feedback{min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.msg{margin:0;font-weight:800;font-size:18px;color:var(--muted)}
.msg.oops{color:var(--oops)}
.msg.good{color:var(--go)}
.btn{font:inherit;font-weight:800;font-size:17px;border-radius:999px;padding:10px 18px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.mic{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-size:19px;padding:12px 22px}
.btn.mic.on{background:var(--oops);border-color:var(--oops);color:#fff;animation:pulse 1.2s infinite}
.btn.small{font-size:14px;padding:6px 12px;border-color:var(--line);color:var(--muted)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(195,66,61,.18)}}
.sayit{font-family:var(--font-display);font-size:24px;font-weight:700;background:var(--sun);color:var(--sun-ink);padding:8px 16px;border-radius:14px}
.celebrate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:20px 0}
.celebrate .big{font-size:56px;line-height:1}
.celebrate h2{font-family:var(--font-display);font-size:34px;margin:0}
.celebrate p{margin:0;color:var(--muted);font-weight:700;font-size:18px}

.bank-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.bank-head h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600}
.bank-head p{margin:0;color:var(--muted);font-weight:700;font-size:14px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.card{position:relative;background:var(--paper);border:3px dashed var(--line);border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.card:hover{border-color:var(--ink)}
.card.selected{border-style:solid;border-color:var(--focus);box-shadow:0 0 0 3px var(--focus)}
.card.lifting{opacity:.3}
.card .pic{width:100%;aspect-ratio:220/200;border-radius:12px;overflow:hidden}
.card .w{font-family:var(--font-display);font-weight:600;font-size:21px}
.card.act .tile2{width:100%;aspect-ratio:220/200;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-size:54px}
.card.act .w{font-size:17px;text-align:center;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(-4deg) scale(1.06);box-shadow:0 14px 28px var(--shadow);cursor:grabbing;border-style:solid;border-color:var(--ink)}

.he-chip{display:none;position:absolute;top:5px;right:5px;font:700 13px system-ui,sans-serif;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:3px 7px;cursor:pointer;z-index:2}
body.he-on .he-chip{display:block}
.he-bubble{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--paper);font:700 19px system-ui,sans-serif;padding:6px 12px;border-radius:10px;white-space:nowrap;z-index:5;direction:rtl;pointer-events:none}

.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

[hidden]{display:none!important}
/* course map */
.course{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-top:34px}
.course .track{position:absolute;left:calc(100% / 14);right:calc(100% / 14);top:55px;height:6px;background:var(--sky-2);border-radius:3px}
.course .fill{height:100%;width:0;background:var(--sun);border-radius:3px;transition:width 1.2s ease}
.stn{font:inherit;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);z-index:1;min-width:0;padding:0}
.stn .c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:3px solid var(--line);font:700 20px var(--font-display);transition:transform .3s}
.stn.done .c{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.stn.here .c{border-color:var(--ink);transform:scale(1.15)}
.stn.locked{cursor:not-allowed}
.stn.locked .c{opacity:.5;border-style:dashed}
.stn.finish{cursor:default}
.stn .l{font-size:12.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.2;max-width:100%}
.stn.here .l{color:var(--ink)}
.marker{position:absolute;top:0;left:7%;font-size:30px;line-height:1;transform:translateX(-50%);transition:left 1.4s cubic-bezier(.5,0,.3,1);pointer-events:none;z-index:2}
.marker::after{content:"";}
@media (prefers-reduced-motion:no-preference){.marker{animation:bob 2.2s ease-in-out infinite}}
@keyframes bob{50%{translate:0 -5px}}
.course-cap{margin:-4px 0 0;font-weight:800;color:var(--muted);text-align:center;font-size:14px}
@media (max-width:620px){.stn .l{display:none}.stn .c{width:38px;height:38px;font-size:17px}.course .track{top:51px}}
/* voice panel */
.vpanel{background:var(--paper);border-radius:18px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;box-shadow:0 2px 0 var(--line)}
.vpanel label{font-weight:800}
.vpanel select{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%;min-width:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-weight:800;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.tip{flex-basis:100%;margin:0;color:var(--muted);font-weight:700;font-size:14px}
/* learn the words */
.board{position:relative;overflow:hidden}
.learn-wrap{display:flex;justify-content:center}
.flash{position:relative;width:min(300px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.flash .pic,.flash .emo,.qopt .pic,.qopt .emo{width:100%;aspect-ratio:220/200;border-radius:14px;overflow:hidden;background:var(--sky);display:grid;place-items:center}
.flash .emo{font-size:110px}
.flash .pic svg,.qopt .pic svg{width:100%;height:100%;display:block}
.flash .word{font:700 clamp(30px,6vw,42px) var(--font-display);text-align:center;line-height:1.1}
.flash .ex{font-weight:700;color:var(--muted);font-size:18px;text-align:center}
.count{font-weight:800;color:var(--muted)}
.quiz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:620px){.quiz{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qopt{font:inherit;background:var(--paper);border:3px dashed var(--line);border-radius:18px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.qopt:hover{border-color:var(--ink)}
.qopt .emo{font-size:64px}
.qopt .w{font:600 20px var(--font-display)}
.qopt.right{border-style:solid;border-color:var(--go);background:var(--go-soft)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.confetti span{position:absolute;top:-40px;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(300deg);opacity:0}}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>What's the Weather?</h1>
      <p class="sub">A weather course: learn it, build it, hear it, say it, write it.</p>
    </div>
    <div class="tools">
      <button class="tool stop" id="stopBtn" hidden>■ Stop</button>
      <button class="tool" id="voiceBtn" aria-pressed="true">🔊 Sound on</button>
      <button class="tool" id="pickBtn" aria-expanded="false" aria-controls="vpanel">🗣️ Voice</button>
      <button class="tool" id="hoverBtn" aria-pressed="true">👆 Read on hover</button>
      <button class="tool" id="tilesBtn" aria-pressed="false">🔤 Letter tiles</button>
      <button class="tool" id="heBtn" aria-pressed="false"><span class="he">עברית</span></button>
    </div>
  </header>
  <p class="wake" id="wake">Click anywhere once to turn on the voice.</p>
  <section class="vpanel" id="vpanel" hidden aria-label="Voice settings">
    <label for="voiceSel">Voice</label>
    <select id="voiceSel"></select>
    <span class="seg" role="group" aria-label="Speed"><button id="spNormal" aria-pressed="true">Normal</button><button id="spSlow" aria-pressed="false">🐢 Slow</button></span>
    <button class="btn" id="vtest">▶ Test: sunny · rainy · windy</button>
    <p class="tip" id="vtip"></p>
  </section>

  <nav class="course" id="course" aria-label="Course map"></nav>
  <p class="course-cap" id="courseCap"></p>
  <div class="stagebar">
    <nav class="stages" id="stages" aria-label="Stages"></nav>
    <button class="reset" id="resetBtn">↺ New student</button>
  </div>

  <section class="board" aria-live="polite">
    <div class="board-head">
      <p class="task" id="task"></p>
      <div class="progress" id="progress"></div>
    </div>
    <div id="body"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section id="bankSec" hidden>
    <div class="bank-head">
      <h2>Cards</h2>
      <p>Drag a card, or tap a card and then tap a box.</p>
    </div>
    <div class="bank" id="bank"></div>
  </section>
</div>

  const d = Array.from({length:m + 1}, (_, i) => [i]); for(let j = 1; j <= n; j++) d[0][j] = j;
  for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}

const rate = () => slow ? 0.7 : 0.88;

/* Single words on hover: always the device voice (quick, many per minute).

const sayWord = w => browserSay(w);
function browserSayFull(text){

    if(!canBrowserSpeak) return resolve(true);
    speechSynthesis.cancel();
    const u = utter(text);
    let settled = false; const fin = v => { if(!settled){ settled = true; clearTimeout(safety); resolve(v); } };
    const safety = setTimeout(() => fin(true), 2500 + text.split(' ').length * 600 / rate());

let actx = null;
function tone(notes, type = 'sine', len = 0.13){
  if(!voiceOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * len;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len * 1.6);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + len * 1.8);
    });
  } catch(e){}
}

    const lv = +b.dataset.lv;

function confetti(){

    `<span class="dot ${i < S.idx || (i === S.idx && S.solved) ? 'done' : ''} ${i === S.idx ? 'now' : ''}"></span>`).join('');

function renderFinished(){
  const stages = stagesOf(LV), lastStage = ST === stages.length - 1, lastLevel = LV === LEVELS.length - 1;

  if(!lastStage){
    big = '⭐⭐⭐'; title = 'Great job!'; sub = `${stages[ST].name.replace(/^\S+\s/, '')}: done.`;
    label = `Next: ${stages[ST + 1].name} →`; go = () => startStage(LV, ST + 1, true);
  } else if(!lastLevel){

/* ---------- Learn the words: meet each card, then "Find it!" ---------- */
function startDeck(speakFirst){

  render();

}
function playCard(){

}

function flashPic(w){

}
function renderLearn(){
  const body = $('body'), f = $('feedback');
  if(S.phase === 'meet'){
    const w = S.cards[S.i], last = S.i === S.cards.length - 1;
    $('task').textContent = 'Look. Listen. Say the word out loud.';
    $('progress').innerHTML = `<span class="count">${S.i + 1} / ${S.cards.length}</span>`;
    body.innerHTML = `<div class="learn-wrap"><div class="flash pop">${flashPic(w)}<span class="word" id="fword">${w}</span><span class="ex">${exampleOf(w)}</span><button class="he-chip" aria-label="Hebrew">עב</button></div></div>`;

  }

  const q = S.q, target = q.rounds[q.r];

  $('progress').innerHTML = q.rounds.map((_, i) => `<span class="dot ${i < q.r || (i === q.r && q.got) ? 'done' : ''} ${i === q.r ? 'now' : ''}"></span>`).join('');
  body.innerHTML = `<div class="quiz">${q.opts.map(o => `<button class="qopt ${q.got && o === target ? 'right' : ''}" data-w="${esc(o)}" aria-label="Picture">${flashPic(o)}${q.got && o === target ? `<span class="w">${o}</span>` : ''}</button>`).join('')}</div>`;
  body.querySelectorAll('.qopt').forEach(b => b.onclick = () => answerQuiz(b.dataset.w, b));
  f.innerHTML = `<button class="btn" id="qhear">🔊 Hear it again</button>${q.got ? '<span class="sayit pop">⭐ Yes!</span>' : ''}`;
  $('qhear').onclick = () => saySentence(target);
}
function startQuiz(){
  /* every word three times, shuffled, never the same word twice in a row */
  let rounds;
  do { rounds = shuffle([...S.cards, ...S.cards, ...S.cards]); } while(rounds.some((w, i) => i && w === rounds[i - 1]) && fixRepeats(rounds));
  S.phase = 'quiz'; S.q = { rounds, r:0, got:false };

}
function fixRepeats(a){
  for(let i = 1; i < a.length; i++) if(a[i] === a[i - 1]){
    const j = a.findIndex((w, k) => k > i && w !== a[i - 1] && (k + 1 >= a.length || a[k + 1] !== a[i]) && a[k - 1] !== a[i]);
    if(j < 0) return true;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.some((w, i) => i && w === a[i - 1]);
}
function newRound(){
  const q = S.q, target = q.rounds[q.r];
  q.got = false;
  q.opts = shuffle([target, ...pick(S.cards.filter(c => c !== target), 3)]);
  render();
  setTimeout(() => saySentence(target), 250);
}
function answerQuiz(w, el){
  const q = S.q, target = q.rounds[q.r];
  if(q.got) return;
  if(w !== target){
    bad(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    setTimeout(() => saySentence(target), 350);
    return;
  }
  q.got = true; good(); render();
  setTimeout(() => {
    if(!S.learn || S.q !== q) return;
    if(q.r < q.rounds.length - 1){ q.r++; newRound(); } else finishStage();
  }, 1100);
}

/* ---------- Build it ---------- */

function buildComplete(){ return S.tokens.every(t => typeof t !== 'object' || S.filled[t.k]); }
function place(k, id, el){
  if(S.filled[k]) return;

    bad(); browserSay('Try again!');
    if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    S.msg = { text: part().why(S.m, id), oops:true };

}

/* ---------- Listen & repeat / Say it yourself ---------- */
function renderRepeat(sent){
  S.tokens.forEach(t => typeof t === 'string' ? textSpan(sent, t) : picSlot(sent, t.w, t.given ? 'given' : 'shown', true));
  speakControls(() => saySentence(textOf(S.tokens)), '🔊 Hear it');
}
function renderSay(sent){
  const free = part().free;
  S.tokens.forEach(t => {
    if(typeof t === 'string'){ textSpan(sent, t); return; }
    if(free && !t.given){ const b = document.createElement('span'); b.className = 'slot static'; b.innerHTML = '<span class="q">?</span>'; sent.appendChild(b); return; }
    picSlot(sent, t.w, 'shown', S.tries >= 2);

}
function exampleFor(){

  if(P === 3) return `When it is ${m.w} I like to ${pick(ACT_IDS.filter(a => W[a].fits.includes(m.w)), 1)[0]}.`;

}
function speakControls(hear, hearLabel){

  const skip = S.tries >= 2 ? `<button class="btn primary" id="moveon">Next →</button>` : '';
  f.innerHTML = `${heard}${msg}${mic}<button class="btn" id="hear">${hearLabel}</button>${teacher}${skip}`;
  $('hear').onclick = hear;

  if($('selfok')) $('selfok').onclick = () => solved(S.said || textOf(S.tokens));

function checkSpeech(text){

/* dictation */
let L = null;   // current listening session
function micClick(){
  if(!dict) return;
  if(dict.active()){ dict.stop().catch(() => {}); return; }
  stopVoice();
  L = { text:'', partial:'', ok:null };
  S.msg = null; S.heard = '';
  const opts = micLangTried ? undefined : { language:'en' };
  dict.start(opts).then(() => {
    clearTimeout(L && L.timer);
    if(L) L.timer = setTimeout(() => dict.stop().catch(() => {}), 9000);
  }).catch(e => {
    if(e.code === 'unavailable' && !micLangTried){ micLangTried = true; S.msg = { text:'Tap the microphone once more.' }; }
    else if(e.code === 'not_granted' || e.code === 'unavailable'){ micOff = true; S.msg = { text:'The microphone is off. Say it out loud, then tap ✓.' }; }
    else if(e.code === 'dismissed'){ S.msg = { text:'Tap the microphone and choose Allow.' }; }
    else if(e.code === 'rate_limited'){ S.msg = { text:'The microphone is busy. Try again in a moment.' }; }
    else if(e.code !== 'stopped'){ S.msg = { text:'The microphone didn’t start. Try again.', oops:true }; }
    L = null; S.listening = false; render();
  });
}
function liveCheck(){
  if(!L || L.ok) return;
  const text = (L.text + ' ' + L.partial).trim();
  S.heard = text;
  const r = checkSpeech(text);
  if(r.ok){ L.ok = r; dict.stop().catch(() => {}); }
  else if(S.listening){ const h = document.querySelector('.heard q'); if(h) h.textContent = text; else render(); }
}
function finishListening(){
  if(!L) return;
  clearTimeout(L.timer);
  const sess = L; L = null;
  const text = (sess.text + ' ' + sess.partial).trim();
  S.heard = text;
  const r = sess.ok || checkSpeech(text);
  if(r.ok){ solved(r.said || textOf(S.tokens)); return; }
  if(!text){ S.msg = { text:'I didn’t hear anything. Tap the microphone and speak.' }; render(); return; }
  S.tries++; bad();
  if(S.tries >= 2){ S.msg = { text: (r.hint ? r.hint + ' ' : '') + 'Good try! Listen once more, then say it again.' }; render(); saySentence(stage() === 'say' && part().free ? exampleFor() : textOf(S.tokens)); }
  else { S.msg = { text: (r.hint || 'Almost!') + ' Try again.', oops:true }; render(); }
}
function stopListening(){ if(dict && dict.active()){ L = null; dict.stop().catch(() => {}); } }

/* ---------- Write it ---------- */
/* Each blank: state '' (empty/typing) → 'ok' (right) | 'almost' (small slip, corrected for them) | 'copy' (shown the word to copy) → 'given' (filled in for them). */
function makeBlanks(){
  const out = [];
  S.tokens.forEach(t => {
    if(typeof t === 'string' || t.given) return;
    const ans = W[t.w].cat === 'activity' ? W[t.w].key : t.w;
    let letters = ans.split('');
    if(letters.length > 1){ let s; do { s = shuffle(letters); } while(s.join('') === ans); letters = s; }
    out.push({ k:t.k, w:t.w, ans, val:'', state:'', typed:'', misses:0, letters: letters.map(ch => ({ ch, used:false })), picked:[] });
  });
  return out;
}
const blankDone = b => b.state === 'ok' || b.state === 'almost' || b.state === 'given';
/* Letters of the right word that the child missed or got wrong (by longest common subsequence). */
function missedLetters(typed, ans){
  const a = typed.toLowerCase(), b = ans.toLowerCase(), m = a.length, n = b.length;
  const d = Array.from({length:m + 1}, () => new Array(n + 1).fill(0));
  for(let i = m - 1; i >= 0; i--) for(let j = n - 1; j >= 0; j--) d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
  const keep = new Set(); let i = 0, j = 0;
  while(i < m && j < n){ if(a[i] === b[j]){ keep.add(j); i++; j++; } else if(d[i+1][j] >= d[i][j+1]) i++; else j++; }
  return ans.split('').map((ch, k) => keep.has(k) ? ch : `<mark>${ch}</mark>`).join('');
}
function closeEnough(v, ans){
  if(ans.length < 3) return false;
  const limit = ans.length >= 7 ? 2 : 1;
  return levFull(v, ans) <= limit;
}
function levFull(a, b){
  const m = a.length, n = b.length, d = Array.from({length:m + 1}, (_, i) => [i]);
  for(let j = 1; j <= n; j++) d[0][j] = j;
  for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++){
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);  // swapped letters count as one slip
  }
  return d[m][n];
}
function renderWrite(sent){
  S.tokens.forEach(t => {
    if(typeof t === 'string'){ textSpan(sent, t); return; }
    if(t.given){ const sp = document.createElement('span'); sp.className = 'say given-word'; sp.textContent = t.w; hoverSay(sp, t.w); sent.appendChild(sp); return; }
    const bi = S.blanks.findIndex(b => b.k === t.k), b = S.blanks[bi];
    const wrap = document.createElement('span'); wrap.className = 'blankwrap';
    if(S.showPics) wrap.insertAdjacentHTML('beforeend', `<span class="mini" aria-hidden="true">${W[t.w].cat === 'activity' ? W[t.w].emoji : pic(t.w)}</span>`);
    if(W[t.w].cat === 'activity'){
      t.w.split(' ').forEach(word => {
        if(word.toLowerCase() === b.ans){ wrap.appendChild(blankEl(b, bi)); }
        else { const sp = document.createElement('span'); sp.className = 'say'; sp.textContent = word; wrap.appendChild(sp); }
      });
    } else wrap.appendChild(blankEl(b, bi));
    sent.appendChild(wrap);
  });
  const f = $('feedback');
  const msg = S.msg ? `<p class="msg ${S.msg.good ? 'good' : ''}" style="flex-basis:100%">${S.msg.text}</p>` : '';
  if(S.solved){
    f.innerHTML = `${msg}<span class="sayit pop">⭐ Well written!</span>${nextControls()}`;
    wireNext();
    return;
  }
  f.innerHTML = `${msg}<button class="btn" id="hear">🔊 Hear it</button>${tilesOn ? '' : '<button class="btn primary" id="check">Check ✓</button>'}${S.showPics ? '' : '<button class="btn" id="pics">💡 Show pictures</button>'}`;
  $('hear').onclick = () => saySentence(textOf(S.tokens));
  if($('check')) $('check').onclick = checkWriting;
  if($('pics')) $('pics').onclick = () => { S.showPics = true; render(); };
  const firstOpen = sent.querySelector('input.blank:not([readonly])');
  if(firstOpen && S.focusNext){ firstOpen.focus(); S.focusNext = false; }
}
function blankEl(b, bi){
  const col = document.createElement('span'); col.className = 'bcol';
  if(!tilesOn){
    const inp = document.createElement('input');
    const done = blankDone(b);
    inp.className = 'blank' + (b.state === 'ok' || b.state === 'given' ? ' ok' : b.state === 'almost' ? ' almost' : b.state === 'copy' ? ' copy' : '');
    inp.id = 'blank-' + bi; inp.value = done ? b.ans : b.val; inp.readOnly = done;
    inp.setAttribute('aria-label', 'Missing word ' + (bi + 1));
    inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('autocorrect', 'off'); inp.lang = 'en';
    inp.style.width = Math.max(b.ans.length + 1.5, 4) + 'ch';
    inp.addEventListener('input', () => {
      b.val = inp.value;
      if(/[֐-׿]/.test(inp.value)){
        S.msg = { text:'Your keyboard is in Hebrew. Switch it to English (Alt + Shift).' };
        $('feedback').querySelector('.msg')?.remove();
        $('feedback').insertAdjacentHTML('afterbegin', `<p class="msg" style="flex-basis:100%">${S.msg.text}</p>`);
      }
    });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); checkWriting(); } });
    col.appendChild(inp);
    if(b.state === 'almost') col.insertAdjacentHTML('beforeend', `<span class="fix" aria-label="Spelled ${b.ans}">${missedLetters(b.typed, b.ans)}</span>`);
    if(b.state === 'copy') col.insertAdjacentHTML('beforeend', `<span class="fix copy">${b.ans}</span>`);
    return col;
  }
  /* Letter tiles: only the right next letter goes in, so the child builds the spelling in order. */
  const j = document.createElement('span'); j.className = 'jum' + (blankDone(b) ? ' ok' : '');
  const boxes = document.createElement('span'); boxes.className = 'boxes';
  for(let i = 0; i < b.ans.length; i++){
    const bx = document.createElement('span'); bx.className = 'box';
    bx.textContent = blankDone(b) ? b.ans[i] : (b.picked[i] !== undefined ? b.letters[b.picked[i]].ch : '');
    boxes.appendChild(bx);
  }
  j.appendChild(boxes);
  if(!blankDone(b)){
    const tiles = document.createElement('span'); tiles.className = 'tiles';
    const want = b.ans[b.picked.length];
    let hinted = false;
    b.letters.forEach((L2, li) => {
      if(L2.used) return;
      const t = document.createElement('button'); t.className = 'tile'; t.textContent = L2.ch;
      if(b.misses >= 2 && !hinted && L2.ch === want){ t.classList.add('hint'); hinted = true; }
      t.onclick = () => tapTile(b, L2, li, t);
      tiles.appendChild(t);
    });
    j.appendChild(tiles);
  }
  col.appendChild(j);
  return col;
}
function tapTile(b, L2, li, el){
  const want = b.ans[b.picked.length];
  if(L2.ch !== want){
    b.misses++; bad();
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    if(b.misses === 2){ S.msg = { text:'Look for the glowing letter.' }; render(); }
    return;
  }
  L2.used = true; b.picked.push(li); b.misses = 0; sayLetter(L2.ch);
  if(b.picked.length === b.ans.length){ b.state = 'ok'; good(); sayWord(b.ans); S.msg = null; }
  if(S.blanks.every(blankDone)) solved(textOf(S.tokens)); else render();
}
function sayLetter(ch){ if(hoverOn) browserSay(ch); }
function checkWriting(){
  let anyCopy = false, anyAlmost = false;
  S.blanks.forEach(b => {
    if(blankDone(b)) return;
    const v = (b.val || '').trim().toLowerCase(), ans = b.ans.toLowerCase();
    if(!v) return;
    if(v === ans){ b.state = 'ok'; return; }
    if(closeEnough(v, ans)){ b.state = 'almost'; b.typed = b.val.trim(); anyAlmost = true; return; }
    if(b.state === 'copy'){ b.state = 'given'; return; }       // second miss: fill it in, the word stays on screen
    b.state = 'copy'; b.val = ''; anyCopy = true;
  });
  if(S.blanks.some(b => !blankDone(b) && !(b.val || '').trim() && b.state !== 'copy')){
    S.msg = { text:'Write a word in every space. Tap 🔊 to hear the sentence again.' }; render(); return;
  }
  if(anyCopy){ S.msg = { text:'This is how we spell it. Copy the word into the space.' }; S.focusNext = true; render(); return; }
  if(S.blanks.every(blankDone)){
    if(anyAlmost) S.msg = { text:'Almost! Look at the yellow letters. That’s the right spelling.', good:true };
    else if(S.blanks.some(b => b.state === 'given')) S.msg = { text:'Look at the spelling, then listen to the sentence.' };
    else S.msg = null;
    good(); solved(textOf(S.tokens)); return;
  }
  render();
}

/* ================= cards: tap, drag, Hebrew ================= */
function selectCard(id){ S.selected = S.selected === id ? null : id; if(S.selected) sayWord(id); render(); }
function wireCard(c, id){
  const chip = c.querySelector('.he-chip');
  chip.addEventListener('pointerdown', e => e.stopPropagation());
  chip.addEventListener('click', e => {
    e.stopPropagation();
    c.querySelectorAll('.he-bubble').forEach(b => b.remove());
    const b = document.createElement('span'); b.className = 'he-bubble'; b.textContent = W[id].he;
    c.appendChild(b); setTimeout(() => b.remove(), 2500);
  });
  hoverSay(c, id);
  c.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectCard(id); } });
  c.addEventListener('click', () => { if(c.dataset.dragged){ delete c.dataset.dragged; return; } selectCard(id); });
  c.addEventListener('pointerdown', e => {
    if(e.button > 0) return;
    const rect = c.getBoundingClientRect();
    dragging = { c, id, x0:e.clientX, y0:e.clientY, dx:e.clientX - rect.left, dy:e.clientY - rect.top, w:rect.width, moved:false, ghost:null, over:null };
    try { c.setPointerCapture(e.pointerId); } catch(err){}
  });
  c.addEventListener('pointermove', e => {
    const d = dragging; if(!d || d.c !== c) return;
    if(!d.moved){
      if(Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
      d.moved = true; clearTimeout(hoverTimer);
      d.ghost = c.cloneNode(true); d.ghost.classList.add('ghost'); d.ghost.classList.remove('selected');
      d.ghost.style.width = d.w + 'px'; document.body.appendChild(d.ghost);
      c.classList.add('lifting');
    }
    d.ghost.style.left = (e.clientX - d.dx) + 'px'; d.ghost.style.top = (e.clientY - d.dy) + 'px';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const sl = under && under.closest('.slot[data-k]:not(.filled):not(.given)');
    if(d.over && d.over !== sl) d.over.classList.remove('over');
    if(sl) sl.classList.add('over');
    d.over = sl;
  });
  const end = e => {
    const d = dragging; if(!d || d.c !== c) return;
    dragging = null;
    if(!d.moved) return;
    c.dataset.dragged = '1';
    d.ghost && d.ghost.remove(); c.classList.remove('lifting');
    if(d.over){ d.over.classList.remove('over'); if(e.type === 'pointerup') place(d.over.dataset.k, id, d.over); }
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
}

function wireDict(d){
  dict = d;
  if(!d){ if(S && !S.learn) render(); return; }
  d.onPartial(({ text }) => { if(L){ L.partial = text; liveCheck(); } });
  d.onFinal(({ text }) => { if(L){ L.text += text; L.partial = ''; liveCheck(); } });
  d.onState(({ state }) => {
    if(!S || S.learn) return;
    const was = S.listening;
    S.listening = state === 'listening' || state === 'starting' || state === 'finishing';
    if(state === 'idle'){ if(L) finishListening(); else if(was) render(); }
    else if(!was && (stage() === 'repeat' || stage() === 'say')) render();
  });
  if(S && !S.learn) render();
}
/* Same shape as Claude's dictation, built on the browser's SpeechRecognition (Chrome, Edge, Safari). */
function browserDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  let rec = null, on = false, cbP = () => {}, cbF = () => {}, cbS = () => {}, stopDone = null;
  return {
    active: () => on,
    onPartial(f){ cbP = f; }, onFinal(f){ cbF = f; }, onState(f){ cbS = f; },
    start(){
      return new Promise((resolve, reject) => {
        let started = false;
        try { rec = new SR(); } catch(e){ reject({ code:'unavailable' }); return; }
        rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
        rec.onstart = () => { started = true; on = true; cbS({ state:'listening' }); resolve(); };
        rec.onresult = e => {
          let interim = '';
          for(let i = e.resultIndex; i < e.results.length; i++){
            const r = e.results[i];
            if(r.isFinal) cbF({ text: r[0].transcript + ' ' }); else interim += r[0].transcript;
          }
          cbP({ text: interim });
        };
        rec.onerror = e => {
          if(started) return;
          reject({ code: (e.error === 'not-allowed' || e.error === 'service-not-allowed') ? 'not_granted' : e.error === 'aborted' ? 'stopped' : 'unavailable' });
        };
        rec.onend = () => {
          const was = on; on = false;
          if(was) cbS({ state:'idle' });
          if(stopDone){ stopDone(); stopDone = null; }
        };
        try { rec.start(); } catch(e){ reject({ code:'unavailable' }); }
      });
    },
    stop(){ return new Promise(res => { if(!rec || !on){ res(); return; } stopDone = res; try { rec.stop(); } catch(e){ res(); } }); }
  };
}
